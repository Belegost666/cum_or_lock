<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUM OR LOCK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  :root {
    --bg: #0a0608;
    --surface: #130d10;
    --card-back: #1e1218;
    --card-border: #3d1f2a;
    --gold: #c9973a;
    --red: #c0392b;
    --red-light: #e74c3c;
    --blue: #2980b9;
    --blue-light: #3498db;
    --water: #5dade2;
    --text: #e8ddd2;
    --text-dim: #8a7570;
    --glow-red: rgba(192,57,43,0.4);
    --glow-blue: rgba(41,128,185,0.4);
    --glow-water: rgba(93,173,226,0.5);
    --glow-gold: rgba(201,151,58,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(180,30,60,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(30,80,160,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 900;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 0 30px var(--glow-gold), 0 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 10px;
    text-align: center;
  }

  .divider {
    width: 80px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 0 auto 14px;
  }

  .status-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 16px;
    min-width: 90px;
  }

  .stat-label {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 3px;
  }

  .stat-value { font-size: 1.5rem; font-weight: 700; }
  .stat-value.red  { color: var(--red-light); }
  .stat-value.blue { color: var(--blue-light); }

  /* BANNERS */
  .banner {
    display: none;
    border-radius: 12px;
    padding: 14px 20px;
    text-align: center;
    margin-bottom: 14px;
    max-width: 440px;
    width: 100%;
  }
  .banner.visible { display: block; }

  .banner-lock {
    background: linear-gradient(135deg, #1a0505, #2a0808);
    border: 1px solid var(--red);
    box-shadow: 0 0 24px var(--glow-red);
  }
  .banner-win {
    background: linear-gradient(135deg, #030d1a, #061628);
    border: 1px solid var(--blue);
    box-shadow: 0 0 24px var(--glow-blue);
  }

  .banner-icon { font-size: 1.8rem; margin-bottom: 4px; }

  .banner-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .banner-lock .banner-title { color: var(--red-light); }
  .banner-win  .banner-title { color: var(--water); }

  .banner-desc {
    font-size: 1.15rem;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.5;
  }

  .banner-time {
    font-size: 1.05rem;
    color: var(--gold);
    margin-top: 7px;
    font-weight: 700;
    font-family: 'Cinzel', serif;
  }

  /* PROGRESS DOTS */
  .progress-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .progress-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .progress-label {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .dots { display: flex; gap: 6px; }
  .dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 1.5px solid var(--card-border);
    background: transparent;
    transition: all 0.3s;
  }
  .dot.water.filled { background: var(--water); border-color: var(--water); box-shadow: 0 0 8px var(--glow-water); }
  .dot.cross.filled { background: var(--red);   border-color: var(--red);   box-shadow: 0 0 8px var(--glow-red); }

  /* GRID */
  .grid-wrap { position: relative; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(94vw, 480px);
  }

  .card { aspect-ratio: 1; perspective: 600px; cursor: pointer; }
  .card.revealed { cursor: default; pointer-events: none; }
  .card.disabled { cursor: not-allowed; opacity: 0.5; pointer-events: none; }

  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
    border-radius: 10px;
  }
  .card.revealed .card-inner { transform: rotateY(180deg); }

  .card-front, .card-back {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
  }

  .card-front {
    background: var(--card-back);
    border: 1px solid var(--card-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 8px rgba(0,0,0,0.5);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:not(.revealed):not(.disabled):hover .card-front {
    border-color: var(--gold);
    box-shadow: 0 0 16px var(--glow-gold), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .card-front::after {
    content: '?';
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: var(--card-border);
    font-weight: 700;
  }

  .card-back {
    background: var(--surface);
    border: 1px solid var(--card-border);
    transform: rotateY(180deg);
  }

  .card-back.water    { border-color: var(--water); box-shadow: 0 0 20px var(--glow-water); background: linear-gradient(135deg,#030d14,#04141f); }
  .card-back.cross    { border-color: var(--red);   box-shadow: 0 0 20px var(--glow-red);   background: linear-gradient(135deg,#100204,#1a0306); }
  .card-back.red-mod  { border-color: var(--red);   box-shadow: 0 0 10px rgba(192,57,43,.2); background: linear-gradient(135deg,#0f0303,#160404); }
  .card-back.blue-mod { border-color: var(--blue);  box-shadow: 0 0 10px rgba(41,128,185,.2); background: linear-gradient(135deg,#020810,#030d18); }
  .card-back.empty-mod { border-color: #2a2a2a; background: linear-gradient(135deg,#0d0d0d,#111); }

  @keyframes pulseWater {
    0%,100% { box-shadow: 0 0 20px var(--glow-water); }
    50%      { box-shadow: 0 0 40px rgba(93,173,226,0.8); }
  }
  @keyframes pulseCross {
    0%,100% { box-shadow: 0 0 20px var(--glow-red); }
    50%      { box-shadow: 0 0 40px rgba(192,57,43,0.8); }
  }
  .card.revealed .card-back.water { animation: pulseWater 2s infinite; }
  .card.revealed .card-back.cross { animation: pulseCross 2s infinite; }

  .overlay-lock {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10,3,5,0.75);
    border-radius: 10px;
    z-index: 10;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    backdrop-filter: blur(2px);
  }
  .overlay-lock.visible { display: flex; }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.2s;
  }
  .btn-primary  { background: transparent; border-color: var(--gold);     color: var(--gold); }
  .btn-primary:hover  { background: var(--gold); color: var(--bg); box-shadow: 0 0 20px var(--glow-gold); }
  .btn-secondary { background: transparent; border-color: var(--text-dim); color: var(--text-dim); }
  .btn-secondary:hover { border-color: var(--text); color: var(--text); }
</style>
</head>
<body>

<h1>CUM OR LOCK</h1>
<div class="divider"></div>

<div class="status-bar">
  <div class="stat">
    <div class="stat-label">Jours de blocage</div>
    <div class="stat-value red" id="stat-days">1</div>
  </div>
  <div class="stat">
    <div class="stat-label">Minutes de plaisir</div>
    <div class="stat-value blue" id="stat-mins">2</div>
  </div>
</div>

<div class="banner banner-lock" id="banner-lock">
  <div class="banner-icon">🔒</div>
  <div class="banner-title">Jeu verrouillé</div>
  <div class="banner-desc" id="lock-desc"></div>
  <div class="banner-time" id="lock-time"></div>
</div>

<div class="banner banner-win" id="banner-win">
  <div class="banner-icon">💦</div>
  <div class="banner-title">Tu peux jouir !</div>
  <div class="banner-desc" id="win-desc"></div>
</div>

<div class="progress-row">
  <div class="progress-group">
    <div class="progress-label">💦 Trouvés</div>
    <div class="dots">
      <div class="dot water" id="w0"></div>
      <div class="dot water" id="w1"></div>
      <div class="dot water" id="w2"></div>
    </div>
  </div>
  <div class="progress-group">
    <div class="progress-label">❌ Trouvés</div>
    <div class="dots">
      <div class="dot cross" id="c0"></div>
      <div class="dot cross" id="c1"></div>
      <div class="dot cross" id="c2"></div>
    </div>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="overlay-lock" id="overlay-lock">🔒</div>
</div>

<div class="btn-row">
  <button class="btn-primary"   id="btn-new">↺ Nouveau jeu</button>
  <button class="btn-secondary" id="btn-wipe">⚠ Tout réinitialiser</button>
</div>

<script>
const SAVE_KEY = 'cum_or_lock_v1';

function defaultState() {
  return {
    locked: false,
    lockUntil: null,
    currentMins: 2,
    currentDays: 1,
    board: null,
    waterCount: 0,
    crossCount: 0,
    gameOver: false,
    gameResult: null,
  };
}

let state = defaultState();

function loadState() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) state = Object.assign(defaultState(), JSON.parse(s));
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ===== BOARD =====
const CARDS = [
  { type:'water',  css:'water',     count:3 },
  { type:'cross',  css:'cross',     count:3 },
  { type:'red1',   css:'red-mod',   count:2 },
  { type:'red2',   css:'red-mod',   count:1 },
  { type:'redx2',  css:'red-mod',   count:1 },
  { type:'blue2',  css:'blue-mod',  count:2 },
  { type:'blue5',  css:'blue-mod',  count:1 },
  { type:'bluex2', css:'blue-mod',  count:1 },
  { type:'empty',  css:'empty-mod', count:2 },
];

function generateBoard() {
  let cards = [];
  for (const c of CARDS)
    for (let i = 0; i < c.count; i++)
      cards.push({ type: c.type, css: c.css, revealed: false });
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

function symbolFor(type) {
  const R = `color:var(--red-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700`;
  const B = `color:var(--blue-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700`;
  const map = {
    water:  '💦',
    cross:  '❌',
    red1:   `<span style="${R}">+1</span>`,
    red2:   `<span style="${R}">+2</span>`,
    redx2:  `<span style="${R}">×2</span>`,
    blue2:  `<span style="${B}">+2</span>`,
    blue5:  `<span style="${B}">+5</span>`,
    bluex2: `<span style="${B}">×2</span>`,
    empty:  `<span style="color:var(--text-dim);font-size:1.4rem">—</span>`,
  };
  return map[type] || '';
}

function initGame() {
  state.board = generateBoard();
  state.waterCount = 0;
  state.crossCount = 0;
  state.currentMins = 2;
  state.currentDays = 1;
  state.gameOver = false;
  state.gameResult = null;
  saveState();
  render();
}

function checkLockExpiry() {
  if (state.locked && state.lockUntil) {
    if (new Date() >= new Date(state.lockUntil)) {
      state.locked    = false;
      state.lockUntil = null;
      state.board     = null;
      state.gameOver  = false;
      state.gameResult = null;
      saveState();
    }
  }
}

function revealCard(index) {
  if (state.locked || state.gameOver) return;
  const card = state.board[index];
  if (card.revealed) return;
  card.revealed = true;

  switch (card.type) {
    case 'water':  state.waterCount++; break;
    case 'cross':  state.crossCount++; break;
    case 'red1':   state.currentDays += 1; break;
    case 'red2':   state.currentDays += 2; break;
    case 'redx2':  state.currentDays *= 2;  break;
    case 'blue2':  state.currentMins += 2; break;
    case 'blue5':  state.currentMins += 5; break;
    case 'bluex2': state.currentMins *= 2;  break;
  }

  if (state.waterCount >= 3) {
    state.gameOver = true;
    state.gameResult = 'win';
  } else if (state.crossCount >= 3) {
    state.gameOver = true;
    state.gameResult = 'lose';
    state.locked = true;
    const until = new Date();
    until.setDate(until.getDate() + state.currentDays);
    until.setHours(0, 0, 0, 0);
    state.lockUntil = until.toISOString();
  }

  saveState();
  render();
}

function render() {
  checkLockExpiry();

  document.getElementById('stat-days').textContent = state.currentDays;
  document.getElementById('stat-mins').textContent = state.currentMins;

  const bLock = document.getElementById('banner-lock');
  const bWin  = document.getElementById('banner-win');

  if (state.locked) {
    bLock.classList.add('visible');
    bWin.classList.remove('visible');
    const until    = new Date(state.lockUntil);
    const diffDays = Math.ceil((until - new Date()) / 86400000);
    document.getElementById('lock-desc').textContent =
      `Tu dois te masturber sans jouir chaque soir pendant ${state.currentMins} minutes.`;
    document.getElementById('lock-time').textContent =
      `Débloqué dans ${diffDays} jour${diffDays > 1 ? 's' : ''} — le ${until.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'})}`;
  } else if (state.gameResult === 'win') {
    bLock.classList.remove('visible');
    bWin.classList.add('visible');
    document.getElementById('win-desc').textContent =
      `Masturbation d'abord : ${state.currentMins} minutes de plaisir, puis tu peux jouir. Bonne récompense !`;
  } else {
    bLock.classList.remove('visible');
    bWin.classList.remove('visible');
  }

  for (let i = 0; i < 3; i++) {
    document.getElementById('w'+i).className = 'dot water' + (i < state.waterCount ? ' filled' : '');
    document.getElementById('c'+i).className = 'dot cross' + (i < state.crossCount ? ' filled' : '');
  }

  const grid = document.getElementById('grid');
  if (!state.board) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);font-style:italic;padding:20px">Lance un nouveau jeu.</p>';
  } else {
    grid.innerHTML = '';
    state.board.forEach((card, i) => {
      const el = document.createElement('div');
      const disabled = (state.gameOver || state.locked) && !card.revealed;
      el.className = 'card' + (card.revealed ? ' revealed' : '') + (disabled ? ' disabled' : '');
      el.innerHTML = `<div class="card-inner">
        <div class="card-front"></div>
        <div class="card-back ${card.css}">${symbolFor(card.type)}</div>
      </div>`;
      if (!card.revealed && !state.gameOver && !state.locked)
        el.addEventListener('click', () => revealCard(i));
      grid.appendChild(el);
    });
  }

  document.getElementById('overlay-lock').classList.toggle('visible', state.locked);
}

document.getElementById('btn-new').addEventListener('click', () => {
  if (state.locked) {
    alert('Le jeu est verrouillé ! Tu ne peux pas relancer avant la date de déblocage.');
    return;
  }
  initGame();
});

document.getElementById('btn-wipe').addEventListener('click', () => {
  if (confirm('Effacer toute la progression (y compris le verrouillage) ?')) {
    try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
    state = defaultState();
    initGame();
  }
});

// ===== START =====
loadState();
checkLockExpiry();
if (!state.board && !state.locked) {
  initGame();
} else {
  render();
}
</script>
</body>
</html>
