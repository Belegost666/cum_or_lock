<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUM OR LOCK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  :root {
    --bg: #0a0608;
    --surface: #130d10;
    --card-back: #1e1218;
    --card-border: #3d1f2a;
    --gold: #c9973a;
    --gold-light: #e8b85a;
    --red: #c0392b;
    --red-light: #e74c3c;
    --blue: #2980b9;
    --blue-light: #3498db;
    --water: #5dade2;
    --text: #e8ddd2;
    --text-dim: #8a7570;
    --glow-red: rgba(192, 57, 43, 0.4);
    --glow-blue: rgba(41, 128, 185, 0.4);
    --glow-water: rgba(93, 173, 226, 0.5);
    --glow-gold: rgba(201, 151, 58, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(180,30,60,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(30,80,160,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 0 30px var(--glow-gold), 0 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    font-style: italic;
    font-size: 1rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    text-align: center;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 18px;
    min-width: 100px;
  }

  .stat-label {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold);
  }

  .stat-value.red { color: var(--red-light); }
  .stat-value.blue { color: var(--blue-light); }

  /* LOCK BANNER */
  .lock-banner {
    display: none;
    background: linear-gradient(135deg, #1a0505, #2a0808);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 16px 24px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 0 24px var(--glow-red);
    max-width: 460px;
    width: 100%;
  }

  .lock-banner.visible { display: block; }

  .lock-banner .lock-icon { font-size: 2rem; margin-bottom: 6px; }
  .lock-banner .lock-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--red-light);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .lock-banner .lock-desc {
    font-size: 1.2rem;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.5;
  }
  .lock-banner .unlock-time {
    font-size: 1.1rem;
    color: var(--gold);
    margin-top: 8px;
    font-weight: 700;
  }

  /* WIN BANNER */
  .win-banner {
    display: none;
    background: linear-gradient(135deg, #030d1a, #061628);
    border: 1px solid var(--blue);
    border-radius: 12px;
    padding: 16px 24px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 0 24px var(--glow-blue);
    max-width: 460px;
    width: 100%;
  }

  .win-banner.visible { display: block; }
  .win-banner .win-icon { font-size: 2rem; margin-bottom: 6px; }
  .win-banner .win-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--water);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .win-banner .win-desc {
    font-size: 1.2rem;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.5;
  }

  /* GRID */
  .grid-wrap {
    position: relative;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: min(96vw, 500px);
  }

  /* CARD */
  .card {
    aspect-ratio: 1;
    perspective: 600px;
    cursor: pointer;
  }

  .card.revealed { cursor: default; pointer-events: none; }
  .card.disabled { cursor: not-allowed; opacity: 0.5; pointer-events: none; }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 10px;
  }

  .card.revealed .card-inner { transform: rotateY(180deg); }

  .card-front, .card-back {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
  }

  .card-front {
    background: var(--card-back);
    border: 1px solid var(--card-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 8px rgba(0,0,0,0.5);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .card:not(.revealed):not(.disabled):hover .card-front {
    border-color: var(--gold);
    box-shadow: 0 0 16px var(--glow-gold), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .card-front::after {
    content: '?';
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: var(--card-border);
    font-weight: 700;
  }

  .card-back {
    background: var(--surface);
    border: 1px solid var(--card-border);
    transform: rotateY(180deg);
    flex-direction: column;
    gap: 4px;
    padding: 6px;
  }

  /* Card types */
  .card-back.water {
    border-color: var(--water);
    box-shadow: 0 0 20px var(--glow-water);
    background: linear-gradient(135deg, #030d14, #04141f);
  }

  .card-back.cross {
    border-color: var(--red);
    box-shadow: 0 0 20px var(--glow-red);
    background: linear-gradient(135deg, #100204, #1a0306);
  }

  .card-back.red-mod {
    border-color: var(--red);
    box-shadow: 0 0 10px rgba(192,57,43,0.2);
    background: linear-gradient(135deg, #0f0303, #160404);
  }

  .card-back.blue-mod {
    border-color: var(--blue);
    box-shadow: 0 0 10px rgba(41,128,185,0.2);
    background: linear-gradient(135deg, #020810, #030d18);
  }

  .card-back.empty-mod {
    border-color: #2a2a2a;
    background: linear-gradient(135deg, #0d0d0d, #111);
  }

  .card-label {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1.2;
    text-align: center;
  }

  .card-label.red { color: var(--red-light); }
  .card-label.blue { color: var(--blue-light); }
  .card-label.dim { color: var(--text-dim); }

  /* PROGRESS DOTS */
  .progress-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .progress-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .progress-label {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .dots {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--card-border);
    background: transparent;
    transition: all 0.3s;
  }

  .dot.water.filled { background: var(--water); border-color: var(--water); box-shadow: 0 0 8px var(--glow-water); }
  .dot.cross.filled { background: var(--red); border-color: var(--red); box-shadow: 0 0 8px var(--glow-red); }

  /* BUTTONS */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.2s;
  }

  .btn-primary {
    background: transparent;
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn-primary:hover {
    background: var(--gold);
    color: var(--bg);
    box-shadow: 0 0 20px var(--glow-gold);
  }

  .btn-secondary {
    background: transparent;
    border-color: var(--text-dim);
    color: var(--text-dim);
  }

  .btn-secondary:hover {
    border-color: var(--text);
    color: var(--text);
  }

  /* Overlay for locked */
  .overlay-lock {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10,3,5,0.75);
    border-radius: 10px;
    z-index: 10;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    backdrop-filter: blur(2px);
  }

  .overlay-lock.visible { display: flex; }

  /* Pulse animation for win/lose cards */
  @keyframes pulseWater {
    0%, 100% { box-shadow: 0 0 20px var(--glow-water); }
    50% { box-shadow: 0 0 40px rgba(93,173,226,0.8); }
  }

  @keyframes pulseCross {
    0%, 100% { box-shadow: 0 0 20px var(--glow-red); }
    50% { box-shadow: 0 0 40px rgba(192,57,43,0.8); }
  }

  .card.revealed .card-back.water { animation: pulseWater 2s infinite; }
  .card.revealed .card-back.cross { animation: pulseCross 2s infinite; }

  /* divider */
  .divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 0 auto 16px;
  }

  @media (max-width: 480px) {
    .grid { gap: 8px; width: 98vw; }
    .card-front::after { font-size: 1.4rem; }
    .card-back { font-size: 1.6rem; }
    .card-label { font-size: 0.6rem; }
  }
</style>
</head>
<body>

<h1>CUM OR LOCK</h1>
<div class="divider"></div>

<!-- Stats -->
<div class="status-bar">
  <div class="stat">
    <div class="stat-label">Jours de blocage</div>
    <div class="stat-value red" id="stat-days">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Minutes de plaisir</div>
    <div class="stat-value blue" id="stat-mins">5</div>
  </div>
</div>

<!-- Lock banner -->
<div class="lock-banner" id="lock-banner">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">Jeu verrouillé</div>
  <div class="lock-desc" id="lock-desc">Tu dois te masturber sans jouir chaque soir.</div>
  <div class="unlock-time" id="unlock-time"></div>
</div>

<!-- Win banner -->
<div class="win-banner" id="win-banner">
  <div class="win-icon">💦</div>
  <div class="win-title">Tu peux jouir !</div>
  <div class="win-desc" id="win-desc"></div>
</div>

<!-- Progress dots -->
<div class="progress-row">
  <div class="progress-group">
    <div class="progress-label">💦 Trouvés</div>
    <div class="dots" id="dots-water">
      <div class="dot water" id="w0"></div>
      <div class="dot water" id="w1"></div>
      <div class="dot water" id="w2"></div>
    </div>
  </div>
  <div class="progress-group">
    <div class="progress-label">❌ Trouvés</div>
    <div class="dots" id="dots-cross">
      <div class="dot cross" id="c0"></div>
      <div class="dot cross" id="c1"></div>
      <div class="dot cross" id="c2"></div>
    </div>
  </div>
</div>

<!-- Grid -->
<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="overlay-lock" id="overlay-lock" title="Jeu verrouillé">🔒</div>
</div>

<!-- Buttons -->
<div class="btn-row">
  <button class="btn-primary" id="btn-reset">↺ Nouveau jeu</button>
  <button class="btn-secondary" id="btn-reset-save">⚠ Tout réinitialiser</button>
</div>

<script>
// ===== STATE =====
const SAVE_KEY = 'jeu_desir_v3';

function defaultState() {
  return {
    locked: false,
    lockDays: 0,
    lockUntil: null,  // ISO date string
    baseMins: 2,
    baseDays: 1,
    // current game
    board: null,       // array of {type, label, revealed}
    waterCount: 0,
    crossCount: 0,
    currentMins: 2,
    currentDays: 0,
    gameOver: false,
    gameResult: null,  // 'win' | 'lose'
  };
}

function loadState() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) return Object.assign(defaultState(), JSON.parse(s));
  } catch(e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

let state = loadState();

// ===== BOARD GENERATION =====
const CARD_TYPES = [
  { type: 'water', label: '💦', cssClass: 'water', count: 3 },
  { type: 'cross', label: '❌', cssClass: 'cross', count: 3 },
  { type: 'red1', label: '🔴 +1 jour', cssClass: 'red-mod', count: 2 },
  { type: 'red2', label: '🔴 +2 jours', cssClass: 'red-mod', count: 1 },
  { type: 'redx2', label: '🔴 ×2 jours', cssClass: 'red-mod', count: 1 },
  { type: 'blue2', label: '🔵 +2 min', cssClass: 'blue-mod', count: 2 },
  { type: 'blue5', label: '🔵 +5 min', cssClass: 'blue-mod', count: 1 },
  { type: 'bluex2', label: '🔵 ×2 min', cssClass: 'blue-mod', count: 1 },
  { type: 'empty', label: '—', cssClass: 'empty-mod', count: 2 },
];

function generateBoard() {
  let cards = [];
  for (const t of CARD_TYPES) {
    for (let i = 0; i < t.count; i++) {
      cards.push({ type: t.type, cssClass: t.cssClass, label: labelFor(t.type), revealed: false });
    }
  }
  // shuffle
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

function labelFor(type) {
  const map = {
    water: '💦', cross: '❌',
    red1: '+1 jour', red2: '+2 jours', redx2: '×2 jours',
    blue2: '+2 min', blue5: '+5 min', bluex2: '×2 min',
    empty: '—',
  };
  return map[type] || '';
}

function emojiFor(type) {
  const map = {
    water: '💦',
    cross: '❌',
    red1: '<span style="color:var(--red-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700;">+1</span>',
    red2: '<span style="color:var(--red-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700;">+2</span>',
    redx2: '<span style="color:var(--red-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700;">×2</span>',
    blue2: '<span style="color:var(--blue-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700;">+2</span>',
    blue5: '<span style="color:var(--blue-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700;">+5</span>',
    bluex2: '<span style="color:var(--blue-light);font-family:Cinzel,serif;font-size:2rem;font-weight:700;">×2</span>',
    empty: '<span style="color:var(--text-dim);font-size:1.4rem;">—</span>',
  };
  return map[type] || '';
}

function initGame() {
  state.board = generateBoard();
  state.waterCount = 0;
  state.crossCount = 0;
  state.currentMins = state.baseMins;
  state.currentDays = state.baseDays;
  state.gameOver = false;
  state.gameResult = null;
  saveState();
  render();
}

// ===== LOCK CHECK =====
function checkLockExpiry() {
  if (state.locked && state.lockUntil) {
    const now = new Date();
    const until = new Date(state.lockUntil);
    if (now >= until) {
      state.locked = false;
      state.lockDays = 0;
      state.lockUntil = null;
      state.board = null;
      state.gameOver = false;
      state.gameResult = null;
      saveState();
    }
  }
}

// ===== CARD CLICK =====
function revealCard(index) {
  if (state.locked || state.gameOver) return;
  const card = state.board[index];
  if (card.revealed) return;
  card.revealed = true;

  // Apply effect
  switch (card.type) {
    case 'water':
      state.waterCount++;
      break;
    case 'cross':
      state.crossCount++;
      break;
    case 'red1':
      state.currentDays += 1;
      break;
    case 'red2':
      state.currentDays += 2;
      break;
    case 'redx2':
      state.currentDays = state.currentDays * 2;
      break;
    case 'blue2':
      state.currentMins += 2;
      break;
    case 'blue5':
      state.currentMins += 5;
      break;
    case 'bluex2':
      state.currentMins = state.currentMins * 2;
      break;
    case 'empty':
      break;
  }

  // Check win/lose
  if (state.waterCount >= 3) {
    state.gameOver = true;
    state.gameResult = 'win';
  } else if (state.crossCount >= 3) {
    state.gameOver = true;
    state.gameResult = 'lose';
    // Lock the game
    state.locked = true;
    state.lockDays = state.currentDays;
    const until = new Date();
    until.setDate(until.getDate() + state.currentDays);
    until.setHours(0, 0, 0, 0);
    state.lockUntil = until.toISOString();
  }

  saveState();
  render();
}

// ===== RENDER =====
function render() {
  checkLockExpiry();
  renderStats();
  renderBanners();
  renderGrid();
  renderDots();
  renderLockOverlay();
}

function renderStats() {
  document.getElementById('stat-days').textContent = state.currentDays;
  document.getElementById('stat-mins').textContent = state.currentMins;
}

function renderBanners() {
  const lockBanner = document.getElementById('lock-banner');
  const winBanner = document.getElementById('win-banner');

  if (state.locked) {
    lockBanner.classList.add('visible');
    winBanner.classList.remove('visible');
    const until = new Date(state.lockUntil);
    const now = new Date();
    const diffMs = until - now;
    const diffDays = Math.ceil(diffMs / (1000*60*60*24));
    document.getElementById('lock-desc').textContent =
      `Tu dois te masturber sans jouir chaque soir pendant ${state.currentMins} minutes.`;
    document.getElementById('unlock-time').textContent =
      `Débloqué dans ${diffDays} jour${diffDays > 1 ? 's' : ''} — le ${until.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'})}`;
  } else if (state.gameResult === 'win') {
    lockBanner.classList.remove('visible');
    winBanner.classList.add('visible');
    document.getElementById('win-desc').textContent =
      `Masturbation d'abord : ${state.currentMins} minutes de plaisir, puis tu peux jouir. Bonne récompense !`;
  } else {
    lockBanner.classList.remove('visible');
    winBanner.classList.remove('visible');
  }
}

function renderGrid() {
  const grid = document.getElementById('grid');
  if (!state.board) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);font-style:italic;padding:20px;">Lance un nouveau jeu pour commencer.</p>';
    return;
  }
  grid.innerHTML = '';
  state.board.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card' + (card.revealed ? ' revealed' : '') + ((state.gameOver || state.locked) && !card.revealed ? ' disabled' : '');
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-front"></div>
        <div class="card-back ${card.cssClass}">
          ${emojiFor(card.type)}
        </div>
      </div>`;
    if (!card.revealed && !state.gameOver && !state.locked) {
      el.addEventListener('click', () => revealCard(i));
    }
    grid.appendChild(el);
  });
}

function renderDots() {
  for (let i = 0; i < 3; i++) {
    const wd = document.getElementById('w' + i);
    const cd = document.getElementById('c' + i);
    wd.className = 'dot water' + (i < state.waterCount ? ' filled' : '');
    cd.className = 'dot cross' + (i < state.crossCount ? ' filled' : '');
  }
}

function renderLockOverlay() {
  const ov = document.getElementById('overlay-lock');
  if (state.locked) {
    ov.classList.add('visible');
  } else {
    ov.classList.remove('visible');
  }
}

// ===== BUTTONS =====
document.getElementById('btn-reset').addEventListener('click', () => {
  if (state.locked) {
    alert('Le jeu est verrouillé ! Tu ne peux pas relancer avant la date de déblocage.');
    return;
  }
  initGame();
});

document.getElementById('btn-reset-save').addEventListener('click', () => {
  if (confirm('Effacer toute la progression (y compris le verrouillage) ?')) {
    localStorage.removeItem(SAVE_KEY);
    state = defaultState();
    initGame();
  }
});

// ===== INIT =====
checkLockExpiry();
if (!state.board && !state.locked) {
  initGame();
} else {
  render();
}
